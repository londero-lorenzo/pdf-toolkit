[project]
name = "pdf-core"
version = "0.1.0"
description = "Read-only PDF inspection shared by pdf-toolkit modules (text, images, metadata, forms, attachments)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["pypdf>=5.1,<7"]

[project.optional-dependencies]
pdfium = ["pypdfium2>=4.30"]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
