[project]
name = "pdf-toolkit-workspace"
version = "0.1.0"
description = "Workspace root for pdf-toolkit (not a distributable package)"
requires-python = ">=3.11"
dependencies = ["pdf-core", "pdf-fonts", "pdf-redaction", "pdf-toolkit"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[tool.uv.sources]
pdf-core = { workspace = true }
pdf-fonts = { workspace = true }
pdf-redaction = { workspace = true }
pdf-toolkit = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "pypdfium2>=4.30",
]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
addopts = "-ra --import-mode=importlib"
pythonpath = ["packages/pdf-redaction/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# pytest fixtures are imported into test modules and then used as arguments
"**/tests/**" = ["F401", "F811"]

[tool.ruff.lint.isort]
known-first-party = ["pdf_core", "pdf_fonts", "pdf_redaction", "pdf_toolkit", "redaction_fixtures"]
